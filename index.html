<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A3D7DE" />
  <title>World Map — MVP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --aqua: #A3D7DE;
      --white: #FFFFFF;
      --black: #111111;
      --muted: #68777A;
      --line: rgba(17, 17, 17, .12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--white);
      color: var(--black);
      overflow: hidden;
    }
    .app { display: flex; flex-direction: column; height: 100%; min-height: 360px; }
    .topbar {
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 82px;
      padding: 17px 26px;
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      display: grid; place-items: center;
      width: 44px; height: 44px; flex: 0 0 auto;
      border-radius: 14px; background: var(--aqua);
      border: 1px solid rgba(17,17,17,.08);
    }
    .brand-mark svg { width: 25px; height: 25px; }
    .eyebrow { margin: 0 0 3px; font-size: 10px; line-height: 1.2; font-weight: 800; letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(18px, 2.1vw, 23px); line-height: 1.2; font-weight: 800; letter-spacing: -.045em; }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .count-pill {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 39px; padding: 0 13px; border: 1px solid var(--line);
      border-radius: 999px; font-size: 12px; font-weight: 650; white-space: nowrap;
    }
    .count-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--aqua); border: 1px solid var(--black); }
    button { font: inherit; cursor: pointer; }
    .reset-btn {
      min-height: 39px; padding: 0 15px; border-radius: 999px;
      border: 1px solid var(--black); background: var(--black); color: var(--white);
      font-size: 12px; font-weight: 700; transition: transform .15s, background .15s;
    }
    .reset-btn:hover { background: #303030; }
    .reset-btn:active { transform: scale(.97); }
    .map-wrap { position: relative; flex: 1; min-height: 0; background: #EAF5F6; }
    #map { position: absolute; inset: 0; background: #EAF5F6; }
    .map-card {
      position: absolute; z-index: 400; left: 22px; top: 22px;
      width: min(260px, calc(100vw - 44px)); padding: 16px 17px;
      border: 1px solid rgba(17,17,17,.10); border-radius: 17px;
      background: rgba(255,255,255,.94); box-shadow: 0 8px 28px rgba(17,17,17,.08);
      backdrop-filter: blur(10px); pointer-events: none;
    }
    .card-label { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: .15em; }
    .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #5BAAB4; }
    .map-card h2 { margin: 10px 0 5px; font-size: 19px; letter-spacing: -.04em; }
    .map-card p { margin: 0; color: #596567; font-size: 12px; line-height: 1.65; }
    .coord-card {
      position: absolute; z-index: 400; right: 22px; bottom: 22px;
      display: flex; align-items: center; gap: 10px;
      max-width: calc(100vw - 44px); padding: 11px 14px;
      border: 1px solid rgba(17,17,17,.10); border-radius: 13px;
      background: rgba(255,255,255,.94); box-shadow: 0 8px 28px rgba(17,17,17,.07);
      backdrop-filter: blur(10px); font-size: 11px;
    }
    .coord-label { color: #758184; font-weight: 650; }
    #coords { font-variant-numeric: tabular-nums; font-weight: 750; white-space: nowrap; }
    .footer {
      z-index: 500; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 11px 26px; min-height: 45px; background: var(--white); border-top: 1px solid var(--line);
      font-size: 11px; color: #5E696B;
    }
    .footer strong { color: var(--black); font-weight: 750; }
    .hint { display: flex; gap: 13px; align-items: center; }
    .hint-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .hint-icon { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 6px; background: var(--aqua); color: var(--black); font-size: 12px; font-weight: 800; }
    /* Make Leaflet's controls match the app palette. */
    .leaflet-control-zoom { border: 1px solid rgba(17,17,17,.14) !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 5px 18px rgba(17,17,17,.12) !important; }
    .leaflet-control-zoom a { width: 38px !important; height: 38px !important; line-height: 38px !important; color: var(--black) !important; background: var(--white) !important; border-bottom: 1px solid var(--line) !important; }
    .leaflet-control-zoom a:hover { background: var(--aqua) !important; }
    .leaflet-control-attribution { font-size: 10px !important; background: rgba(255,255,255,.86) !important; }
    .leaflet-control-attribution a { color: #263E41 !important; }
    .leaflet-container { font-family: inherit; }
    .leaflet-marker-icon { cursor: pointer; }
    button:focus-visible { outline: 3px solid #5BAAB4; outline-offset: 3px; }
    @media (max-width: 620px) {
      .topbar { min-height: 72px; padding: 13px 15px; gap: 10px; }
      .brand { gap: 10px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 12px; }
      .top-actions { gap: 7px; }
      .count-pill { min-height: 35px; padding: 0 10px; font-size: 11px; }
      .reset-btn { min-height: 35px; padding: 0 11px; font-size: 11px; }
      .map-card { top: 13px; left: 13px; padding: 13px 14px; width: 220px; }
      .map-card h2 { font-size: 17px; margin-top: 8px; }
      .map-card p { font-size: 11px; }
      .coord-card { right: 13px; bottom: 13px; padding: 9px 11px; }
      .footer { padding: 10px 14px; align-items: flex-start; flex-direction: column; gap: 7px; }
      .hint { gap: 11px; }
    }
    @media (max-width: 390px) {
      .count-pill { display: none; }
      .hint { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.1"/><path d="M3.6 9h16.8M3.6 15h16.8M12 2.9c2.4 2.5 3.5 5.5 3.5 9.1S14.4 18.6 12 21.1C9.6 18.6 8.5 15.6 8.5 12S9.6 5.4 12 2.9Z"/>
          </svg>
        </div>
        <div>
          <p class="eyebrow">WORLD MAP / MVP</p>
          <h1>World Explorer</h1>
        </div>
      </div>
      <div class="top-actions">
        <div class="count-pill" aria-live="polite"><span class="count-dot"></span><span>핀 <span id="pinCount">0</span>개</span></div>
        <button class="reset-btn" id="resetView" type="button" title="처음 세계지도 화면으로 돌아가기">지도 초기화</button>
      </div>
    </header>

    <section class="map-wrap" aria-label="확대, 축소 및 이동 가능한 세계지도">
      <div id="map"></div>
      <aside class="map-card">
        <div class="card-label"><span class="live-dot"></span> INTERACTIVE MAP</div>
        <h2>세계를 탐색해 봐.</h2>
        <p>드래그해서 이동하고, + / − 버튼이나 마우스 휠로 확대·축소해 봐. 지도 위를 클릭하면 핀이 생겨.</p>
      </aside>
      <div class="coord-card" aria-live="polite">
        <span class="coord-label">중앙 좌표</span>
        <span id="coords">0.00°, 0.00°</span>
      </div>
    </section>

    <footer class="footer">
      <span><strong>WORLD EXPLORER</strong> &nbsp;·&nbsp; 지도는 OpenStreetMap을 사용해.</span>
      <div class="hint">
        <span class="hint-item"><span class="hint-icon">↔</span> 드래그 이동</span>
        <span class="hint-item"><span class="hint-icon">+</span> 확대 / 축소</span>
        <span class="hint-item"><span class="hint-icon">⌖</span> 핀 클릭 시 삭제</span>
      </div>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Start with a world view. Leaflet provides mouse/touch drag, wheel zoom and zoom buttons.
    const map = L.map('map', {
      center: [22, 0],
      zoom: 2,
      minZoom: 2,
      maxZoom: 18,
      worldCopyJump: true,
      zoomControl: false,
      scrollWheelZoom: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
    }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    const markers = new Set();
    const countEl = document.getElementById('pinCount');
    const coordsEl = document.getElementById('coords');
    const initialView = { center: [22, 0], zoom: 2 };

    function updatePinCount() {
      countEl.textContent = String(markers.size);
    }
    function updateCoordinates() {
      const c = map.getCenter();
      coordsEl.textContent = `${Math.abs(c.lat).toFixed(2)}°${c.lat >= 0 ? 'N' : 'S'}, ${Math.abs(c.lng).toFixed(2)}°${c.lng >= 0 ? 'E' : 'W'}`;
    }

    // Click on map to add a pin; click a pin to remove it.
    map.on('click', (event) => {
      const marker = L.circleMarker(event.latlng, {
        radius: 7,
        color: '#111111',
        weight: 2,
        opacity: 1,
        fillColor: '#A3D7DE',
        fillOpacity: 1
      }).addTo(map);
      marker.bindTooltip(`${event.latlng.lat.toFixed(4)}, ${event.latlng.lng.toFixed(4)}`, {
        direction: 'top', offset: [0, -7], opacity: 0.95
      });
      markers.add(marker);
      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        map.removeLayer(marker);
        markers.delete(marker);
        updatePinCount();
      });
      updatePinCount();
    });

    map.on('moveend', updateCoordinates);
    document.getElementById('resetView').addEventListener('click', () => {
      map.setView(initialView.center, initialView.zoom, { animate: true });
    });
    updateCoordinates();
  </script>
</body>
</html>
